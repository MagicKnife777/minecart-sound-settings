name: Build and Release

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*' # 当推送以 v 开头的标签（如 v1.0.0）时触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 需要这个权限才能创建 Release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      # 如果是打上了 Tag（比如 v1.0.0），就自动发布 Release
      - name: Create Release and Upload Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar # 自动上传 build/libs 下的所有 jar 包
          generate_release_notes: true # 自动生成更新日志（如果你没写）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub 自动提供的授权令牌